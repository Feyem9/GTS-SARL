<!-- Navbar -->
<nav class="flex items-center justify-between px-6 py-4 bg-purple-900 text-white shadow-lg sticky top-0 z-50">

  <!-- Logo -->
  <a href="/home" class="text-2xl font-bold text-yellow-400 tracking-wide hover:text-yellow-300 transition">
    🏅 BADGE MARKET
  </a>

  <!-- Links -->
  <div class="flex items-center gap-6 text-sm font-semibold">
    <a href="/home"     class="hover:text-yellow-400 transition">HOME</a>
    <a href="/products" class="hover:text-yellow-400 transition">PRODUCTS</a>
    <a href="/custom-order" class="hover:text-yellow-400 transition">CUSTOM ORDER</a>
    <a href="/orders"   class="hover:text-yellow-400 transition">MY ORDERS</a>

    <!-- Cart avec counter -->
    <a href="/cart" class="relative hover:text-yellow-400 transition">
      🛒 CART
      <span *ngIf="getCartCount() > 0"
        class="absolute -top-3 -right-4 bg-yellow-400 text-purple-900 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
        {{ getCartCount() }}
      </span>
    </a>

    <!-- Auth -->
    <ng-container *ngIf="!isAuthenticated()">
      <a href="/login"
        class="px-4 py-2 bg-yellow-400 text-purple-900 rounded-full font-bold hover:bg-yellow-300 transition">
        LOGIN
      </a>
    </ng-container>
    <ng-container *ngIf="isAuthenticated()">
      <button (click)="logout()"
        class="px-4 py-2 border border-white rounded-full hover:bg-white hover:text-purple-900 transition">
        LOGOUT
      </button>
    </ng-container>

    <!-- Admin badge -->
    <a *ngIf="isAdmin()" href="/admin"
      class="px-3 py-1 bg-yellow-400 text-purple-900 rounded-full text-xs font-bold hover:bg-yellow-300 transition">
      ⚙ ADMIN
    </a>
  </div>
</nav>

<!-- Page content -->
<main class="flex-1">
  <router-outlet></router-outlet>
</main>

<!-- Footer -->
<app-footer></app-footer>
