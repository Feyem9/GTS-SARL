<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full text-center">

    <div *ngIf="isVerifying" class="text-purple-700 animate-pulse text-xl">
      Verifying your payment...
    </div>

    <div *ngIf="!isVerifying && status === 'success'">
      <div class="text-6xl mb-4">✅</div>
      <h1 class="text-2xl font-bold text-purple-900 mb-2">Payment Successful!</h1>
      <p class="text-gray-500 mb-6">Your order has been confirmed. Thank you for your purchase.</p>
      <p class="text-sm text-gray-400 mb-6">Order ID: <span class="font-mono">{{ orderId }}</span></p>
      <button (click)="goToOrders()"
        class="px-6 py-3 bg-purple-700 text-white rounded-lg hover:bg-purple-900 font-semibold">
        View My Orders
      </button>
    </div>

    <div *ngIf="!isVerifying && status === 'error'">
      <div class="text-6xl mb-4">⚠️</div>
      <h1 class="text-2xl font-bold text-red-700 mb-2">Verification Error</h1>
      <p class="text-gray-500 mb-6">Payment may have succeeded. Please check your orders.</p>
      <button (click)="goToOrders()"
        class="px-6 py-3 bg-purple-700 text-white rounded-lg hover:bg-purple-900 font-semibold">
        View My Orders
      </button>
    </div>

  </div>
</div>
