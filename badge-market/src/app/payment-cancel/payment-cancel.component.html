<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full text-center">
    <div class="text-6xl mb-4">❌</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment Cancelled</h1>
    <p class="text-gray-500 mb-6">Your payment was cancelled. Your cart is still saved.</p>
    <div class="flex gap-4 justify-center">
      <button (click)="goToCart()"
        class="px-6 py-3 bg-purple-700 text-white rounded-lg hover:bg-purple-900 font-semibold">
        Back to Cart
      </button>
      <button (click)="goHome()"
        class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50">
        Go Home
      </button>
    </div>
  </div>
</div>
