<div class="max-w-2xl mx-auto p-8">
  <h1 class="text-3xl font-bold text-purple-900 mb-2">Custom Badge Order</h1>
  <p class="text-gray-500 mb-8">Design your personalized badge and we'll make it for you.</p>

  <!-- Confirmation -->
  <div *ngIf="isSubmitted" class="bg-green-100 border border-green-400 text-green-700 p-6 rounded-xl text-center">
    <p class="text-2xl font-bold mb-2">✅ Order submitted!</p>
    <p class="mb-4">We'll contact you shortly to confirm your custom badge.</p>
    <button (click)="reset()" class="px-6 py-2 bg-purple-700 text-white rounded hover:bg-purple-900">
      New Order
    </button>
  </div>

  <!-- Formulaire -->
  <form *ngIf="!isSubmitted" (ngSubmit)="submit()" #orderForm="ngForm">

    <!-- Nom du badge -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Badge Name *</label>
      <input type="text" [(ngModel)]="order.name" name="name" required
        placeholder="e.g. Company Badge 2024"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
    </div>

    <!-- Texte sur le badge -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Text on Badge *</label>
      <input type="text" [(ngModel)]="order.text" name="text" required
        placeholder="e.g. John Doe - Manager"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
    </div>

    <!-- Couleur + Forme -->
    <div class="flex gap-4 mb-5">
      <div class="flex-1">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Badge Color *</label>
        <div class="flex items-center gap-3">
          <input type="color" [(ngModel)]="order.color" name="color"
            class="w-12 h-12 rounded cursor-pointer border" />
          <span class="text-gray-600 text-sm">{{ order.color }}</span>
        </div>
      </div>

      <div class="flex-1">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Shape *</label>
        <select [(ngModel)]="order.shape" name="shape"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option *ngFor="let s of shapes" [value]="s.toLowerCase()">{{ s }}</option>
        </select>
      </div>
    </div>

    <!-- Quantité -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Quantity: <span class="text-purple-700 font-bold">{{ order.quantity }}</span>
      </label>
      <input type="range" [(ngModel)]="order.quantity" name="quantity"
        min="1" max="500" step="1"
        class="w-full" />
      <div class="flex justify-between text-xs text-gray-400 mt-1">
        <span>1</span><span>500</span>
      </div>
    </div>

    <!-- Logo URL (optionnel) -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Logo URL (optional)</label>
      <input type="url" [(ngModel)]="order.logoUrl" name="logoUrl"
        placeholder="https://your-logo.com/logo.png"
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
      <div *ngIf="order.logoUrl" class="mt-2">
        <img [src]="order.logoUrl" alt="logo preview" class="h-16 object-contain rounded border" />
      </div>
    </div>

    <!-- Notes -->
    <div class="mb-6">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Additional Notes (optional)</label>
      <textarea [(ngModel)]="order.notes" name="notes" rows="3"
        placeholder="Any special instructions..."
        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
    </div>

    <!-- Aperçu -->
    <div class="mb-6 p-4 rounded-xl border-2 border-dashed border-purple-300 text-center">
      <p class="text-xs text-gray-400 mb-2">Preview</p>
      <div class="inline-block px-6 py-3 text-white font-bold text-lg shadow-md"
        [style.background-color]="order.color"
        [ngClass]="{
          'rounded-full': order.shape === 'round',
          'rounded-none': order.shape === 'square',
          'rounded-3xl': order.shape === 'oval',
          'rounded-lg': order.shape === 'rectangle' || order.shape === 'custom'
        }">
        {{ order.text || 'Your text here' }}
      </div>
    </div>

    <!-- Erreur -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-600 rounded">
      {{ errorMessage }}
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="orderForm.invalid || isLoading"
      class="w-full py-3 bg-purple-700 text-white font-bold rounded-lg hover:bg-purple-900 disabled:opacity-50">
      <ng-container *ngIf="isLoading">Submitting...</ng-container>
      <ng-container *ngIf="!isLoading">Submit Custom Order</ng-container>
    </button>

  </form>
</div>
