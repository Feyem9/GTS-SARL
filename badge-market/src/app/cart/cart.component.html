<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">Your Cart</h1>

  <div *ngIf="getCart().length > 0">
    <div *ngFor="let badge of getCart()" class="flex justify-between items-center border-b py-3">
      <div class="flex items-center gap-3">
        <img [src]="badge.image" [alt]="badge.title" class="w-16 h-16 object-cover rounded" />
        <p class="font-semibold">{{ badge.title | titlecase }}</p>
      </div>
      <div class="flex items-center gap-4">
        <p class="text-purple-700 font-bold">{{ badge.price | currency }}</p>
        <button (click)="remove(badge)" class="text-red-500 hover:text-red-700 text-sm">Remove</button>
      </div>
    </div>

    <div class="flex justify-between items-center mt-6 text-xl font-bold">
      <span>Total</span>
      <span class="text-purple-700">{{ getTotal() | currency }}</span>
    </div>

    <button (click)="clearCart()" class="mt-4 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-700">
      Clear Cart
    </button>

    <button (click)="checkout()" [disabled]="isProcessing"
      class="mt-4 ml-4 px-6 py-2 bg-green-600 text-white rounded hover:bg-green-800 font-bold disabled:opacity-50">
      <ng-container *ngIf="isProcessing">Processing...</ng-container>
      <ng-container *ngIf="!isProcessing">Checkout with PayUnit</ng-container>
    </button>

    <div *ngIf="errorMessage" class="mt-3 p-2 bg-red-100 text-red-600 rounded text-sm">
      {{ errorMessage }}
    </div>
  </div>

  <div *ngIf="getCart().length === 0" class="text-gray-500 text-center mt-10">
    Your cart is empty.
  </div>
</div>
